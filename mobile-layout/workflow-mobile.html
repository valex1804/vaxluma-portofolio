<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portfolio - Storyboard & Video Results (Mobile)</title>

  <!-- Google Fonts: Syne, Outfit, Plus Jakarta Sans, Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Syne:wght@700;800&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --color-lime: #CDFC8A;
      --color-purple: #C77DFF;
      --color-btn-purple: #4B1C93;
      --color-dark: #020024;
      --font-title: 'Syne', sans-serif;
      --font-body: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      --font-button: 'CF Oliviera Demo', 'Syne', 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--color-dark);
      color: #ffffff;
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
      position: relative;
    }

    /* Aurora Atmosphere Backdrop */
    .aurora-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(130% 110% at 18% 8%, #1a0b3e 0%, #0d0524 38%, #050216 68%, var(--color-dark) 100%);
    }

    .aurora-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(75px);
      pointer-events: none;
      opacity: 0.28;
      z-index: 0;
    }
    .blob-1 { top: 4%; left: -25%; width: 320px; height: 320px; background: #5a1e8a; }
    .blob-2 { top: 42%; right: -25%; width: 300px; height: 300px; background: #7b1fa2; }
    .blob-3 { bottom: 8%; left: 5%; width: 280px; height: 280px; background: #3b0966; }

    /* Sticky Mobile Header */
    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 6, 28, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-btn-purple);
      color: var(--color-lime);
      border: 1.5px solid var(--color-lime);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 16px rgba(205, 252, 138, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .back-btn:active {
      transform: scale(0.96);
      box-shadow: 0 0 8px rgba(205, 252, 138, 0.5);
    }

    .back-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .header-badge {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 5px 14px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    /* Container */
    .workflow-container {
      position: relative;
      z-index: 1;
      padding: 20px 16px;
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Storyboard Card */
    .workflow-card {
      background: rgba(18, 12, 48, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      padding: 22px 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
    }

    .workflow-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(199, 125, 255, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      color: var(--color-lime);
      background: rgba(205, 252, 138, 0.14);
      border: 1px solid rgba(205, 252, 138, 0.35);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .section-title {
      font-family: var(--font-title);
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .section-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 18px;
      line-height: 1.45;
    }

    /* Storyboard Strips */
    .storyboard-strip-box {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #000000;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .storyboard-strip-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Video Results Cards */
    .video-card {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(205, 252, 138, 0.85);
      background: #000000;
      position: relative;
      margin-bottom: 18px;
      box-shadow: 0 0 22px rgba(205, 252, 138, 0.28), 0 8px 24px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .video-card:active {
      transform: scale(0.985);
    }

    .video-card.is-playing {
      box-shadow: 0 0 28px rgba(205, 252, 138, 0.55), 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      transition: opacity 0.25s ease;
      z-index: 3;
      pointer-events: none;
    }

    .video-card.is-playing .video-play-overlay {
      opacity: 0;
    }

    .play-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--color-lime);
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 22px rgba(205, 252, 138, 0.75);
    }

    .play-circle svg {
      width: 20px;
      height: 20px;
      fill: #000000;
      transform: translateX(2px);
    }

    .play-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--color-lime);
      background: rgba(14, 10, 36, 0.92);
      border: 1px solid rgba(205, 252, 138, 0.45);
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Hand-drawn organic pencil ring outline */
    .pencil-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- Shared SVG Pencil Filter -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <filter id="pencilStrokeFilter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="roughNoise" />
        <feDisplacementMap in="SourceGraphic" in2="roughNoise" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="aurora-bg"></div>
  <div class="aurora-blob blob-1"></div>
  <div class="aurora-blob blob-2"></div>
  <div class="aurora-blob blob-3"></div>

  <!-- STICKY HEADER -->
  <header class="mobile-header">
    <a href="index.html#branding" class="back-btn" id="workflowBackBtn" title="Back to Branding">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Branding</span>
    </a>
    <span class="header-badge">Storyboard & Video</span>
  </header>

  <!-- CONTENT -->
  <main class="workflow-container">

    <!-- STORYBOARD SECTION -->
    <div class="workflow-card">
      <span class="card-tag">PRODUCTION PHASES</span>
      <h1 class="section-title">Storyboard</h1>
      <p class="section-subtitle">Visual continuity and frame-by-frame pacing engineered for style-consistent video generation.</p>

      <div class="storyboard-strip-box">
        <img src="../assets/storyboard-row1.png" alt="Storyboard KTM Adventure" loading="eager" />
      </div>

      <div class="storyboard-strip-box">
        <img src="../assets/storyboard-row2.png" alt="Storyboard Triumph Highway" loading="lazy" />
      </div>
    </div>

    <!-- VIDEO RESULTS SECTION -->
    <div class="workflow-card">
      <span class="card-tag">GENERATION</span>
      <h2 class="section-title">Video results</h2>
      <p class="section-subtitle">Tap each card to play production renders.</p>

      <!-- Video 1 -->
      <div class="video-card" id="card1" onclick="toggleWorkflowVideo('card1', 'video1')">
        <video id="video1" loop playsinline preload="auto" poster="../assets/freedom-preview.jpg">
          <source src="../assets/videos/Freedom_MotorBike-V2.mp4" type="video/mp4" />
        </video>
        <div class="video-play-overlay">
          <div class="play-circle">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </div>
          <span class="play-badge">Tap to Play</span>
        </div>
      </div>

      <!-- Video 2 -->
      <div class="video-card" id="card2" onclick="toggleWorkflowVideo('card2', 'video2')">
        <video id="video2" loop playsinline preload="auto" poster="../assets/hook-preview.jpg">
          <source src="../assets/videos/Hook-WTF-I-MADE.mp4" type="video/mp4" />
        </video>
        <div class="video-play-overlay">
          <div class="play-circle">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </div>
          <span class="play-badge">Tap to Play</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Smart back button
    const backBtn = document.getElementById('workflowBackBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (document.referrer && (document.referrer.includes('page4-mobile') || document.referrer.includes('index') || document.referrer.includes('mobile-layout'))) {
          history.back();
        } else {
          window.location.href = 'index.html#branding';
        }
      });
    }

    function toggleWorkflowVideo(cardId, videoId) {
      const card = document.getElementById(cardId);
      const video = document.getElementById(videoId);
      if (!card || !video) return;

      if (video.paused) {
        document.querySelectorAll('video').forEach(v => {
          if (v !== video && !v.paused) {
            v.pause();
            v.closest('.video-card')?.classList.remove('is-playing');
          }
        });
        video.play().catch(() => {});
        card.classList.add('is-playing');
      } else {
        video.pause();
        card.classList.remove('is-playing');
      }
    }

    // Direct event sync
    document.querySelectorAll('.video-card video').forEach(v => {
      const card = v.closest('.video-card');
      v.addEventListener('play', () => card.classList.add('is-playing'));
      v.addEventListener('pause', () => card.classList.remove('is-playing'));
      v.addEventListener('ended', () => card.classList.remove('is-playing'));
    });
  </script>
</body>

</html>
